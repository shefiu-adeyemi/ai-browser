name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  python-tests:
    # The app is Windows-first (DPAPI secrets, taskkill, PowerShell), so the tests run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install the package and its dev tools
        run: pip install -e ".[dev]"

      - name: Python tests (fast suite; the real-browser tests are opt-in and do not run here)
        run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build (type-checks the code too)
        run: npm run build
      - name: Dependency audit (what ships to users)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (build tools, informational)
        # Advisories in dev-only tools (today: braces, reached through Tailwind 3's build chain) never reach the
        # built app, so they do not fail the build; they stay visible here until Tailwind is upgraded.
        run: npm audit --audit-level=high
        continue-on-error: true
