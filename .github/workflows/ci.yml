name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    # The app is Windows-first (DPAPI secrets, taskkill, PowerShell), so the tests run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Python tests (fast suite; the real-browser tests are opt-in and do not run here)
        run: python -m unittest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build (type-checks the code too)
        working-directory: frontend
        run: npm run build

      - name: Dependency audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
